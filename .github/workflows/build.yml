name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regression tests
        run: npm test

      # Production first: the build fails if any staging marker would leak into it.
      - name: Production build (guarded)
        run: node build.mjs --production

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: site-production
          path: dist/
          retention-days: 14

      - name: Staging build (review copy)
        run: node build.mjs

      - name: Check CONTENT-GAPS.md is up to date
        run: git diff --exit-code CONTENT-GAPS.md || (echo "Run 'node build.mjs' and commit CONTENT-GAPS.md" && exit 1)

      - name: Upload staging preview
        uses: actions/upload-artifact@v4
        with:
          name: site-staging-preview
          path: dist/
          retention-days: 14
